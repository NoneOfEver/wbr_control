# Production USB MPC integration overlay. The normal PC-link build remains separate.
CONFIG_WBR_CONTROL_PC_LINK=n
CONFIG_WBR_CONTROL_USB_MPC=y
CONFIG_WBR_CONTROL_USB_MPC_HS_INTERVAL=1

# Let high-priority CAN interrupts preempt the lower-priority USB ISR. Nested
# RISC-V trap frames consume the shared ISR stack, so retain explicit margin.
CONFIG_HPM_PLIC_PRIORITY_NESTING=y
CONFIG_HPM_PLIC_MAX_NESTING_DEPTH=4
CONFIG_ISR_STACK_SIZE=4096
